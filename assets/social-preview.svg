<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Dark Tech Canvas Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="40%" stop-color="#091124" />
      <stop offset="80%" stop-color="#0b1730" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Orbs / Ambience -->
    <radialGradient id="cyanGlow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoGlow" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0" />
    </radialGradient>

    <!-- Card Rim / Border Gradients -->
    <linearGradient id="outerBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Bullish Candlestick Gradient -->
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Bridge Arch Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="jsonKeyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="0" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <rect width="1280" height="640" fill="url(#cyanGlow)" />
  <rect width="1280" height="640" fill="url(#emeraldGlow)" />
  <rect width="1280" height="640" fill="url(#indigoGlow)" />

  <!-- Tech Grid Overlay -->
  <rect width="1280" height="640" fill="url(#gridPattern)" />

  <!-- Outer Frame Card with Rounded Bevel and Glowing Rim -->
  <rect x="24" y="24" width="1232" height="592" rx="28" fill="none" stroke="url(#outerBorderGrad)" stroke-width="1.8" />

  <!-- Corner Accents -->
  <path d="M 24 64 L 24 24 L 64 24" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 1256 64 L 1256 24 L 1216 24" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 24 576 L 24 616 L 64 616" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 1256 576 L 1256 616 L 1216 616" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Geometric Circuit Traces (Decorations) -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1.4" fill="none">
    <path d="M 80,100 L 220,100 L 250,70 L 400,70" />
    <path d="M 100,560 L 280,560 L 310,530 L 460,530" />
    <path d="M 850,80 L 980,80 L 1010,110 L 1180,110" />
    <path d="M 800,570 L 950,570 L 980,540 L 1150,540" />
    <circle cx="400" cy="70" r="3.5" fill="#38bdf8" />
    <circle cx="460" cy="530" r="3.5" fill="#10b981" />
    <circle cx="1180" cy="110" r="3.5" fill="#818cf8" />
    <circle cx="1150" cy="540" r="3.5" fill="#38bdf8" />
  </g>

  <!-- ================= LEFT COLUMN: HERO & BRANDING ================= -->
  <g transform="translate(68, 64)">

    <!-- Brand Header (Icon + Title) -->
    <g transform="translate(0, 0)">
      
      <!-- ICON BADGE (Glowing Container) -->
      <g>
        <rect x="0" y="0" width="108" height="108" rx="24" fill="#080e21" stroke="url(#panelBorder)" stroke-width="2" filter="url(#glow)" />

        <!-- Candlestick Charts (Trading Side) -->
        <!-- Candle 1 -->
        <line x1="22" y1="56" x2="22" y2="86" stroke="#10b981" stroke-width="1.8" />
        <rect x="18" y="62" width="8" height="18" rx="1.5" fill="url(#bullGrad)" filter="url(#subtleGlow)" />

        <!-- Candle 2 -->
        <line x1="36" y1="36" x2="36" y2="82" stroke="#38bdf8" stroke-width="1.8" />
        <rect x="32" y="44" width="8" height="28" rx="1.5" fill="url(#cyanGrad)" filter="url(#subtleGlow)" />

        <!-- Candle 3 (Peak) -->
        <line x1="50" y1="24" x2="50" y2="74" stroke="#34d399" stroke-width="1.8" />
        <rect x="46" y="32" width="8" height="32" rx="1.5" fill="url(#bullGrad)" filter="url(#subtleGlow)" />

        <!-- Suspension Bridge Arch -->
        <path d="M 16,72 Q 48,34 88,68" fill="none" stroke="url(#bridgeGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
        <path d="M 16,72 Q 48,34 88,68" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

        <!-- Lower Deck / Bridge Span -->
        <path d="M 12,82 L 96,82" fill="none" stroke="url(#bridgeGrad)" stroke-width="2.5" stroke-linecap="round" />
        
        <!-- Vertical Stay Cables -->
        <line x1="42" y1="52" x2="42" y2="82" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2,1.5" opacity="0.8" />
        <line x1="58" y1="46" x2="58" y2="82" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="2,1.5" opacity="0.8" />
        <line x1="74" y1="54" x2="74" y2="82" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="2,1.5" opacity="0.8" />

        <!-- Digital Network Nodes (REST API Gateway Anchor) -->
        <line x1="88" y1="68" x2="94" y2="40" stroke="#818cf8" stroke-width="1.2" opacity="0.7" />
        <line x1="88" y1="68" x2="74" y2="34" stroke="#60a5fa" stroke-width="1.2" opacity="0.7" />
        <line x1="74" y1="34" x2="94" y2="40" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />

        <circle cx="88" cy="68" r="3.5" fill="#38bdf8" filter="url(#glow)" />
        <circle cx="88" cy="68" r="1.8" fill="#ffffff" />
        
        <circle cx="94" cy="40" r="3" fill="#818cf8" filter="url(#subtleGlow)" />
        <circle cx="94" cy="40" r="1.5" fill="#ffffff" />

        <circle cx="74" cy="34" r="3" fill="#60a5fa" filter="url(#subtleGlow)" />
        <circle cx="74" cy="34" r="1.5" fill="#ffffff" />
      </g>

      <!-- Project Name -->
      <g transform="translate(132, 12)">
        <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
          <tspan fill="url(#cyanGrad)" filter="url(#subtleGlow)">MT5</tspan>
          <tspan fill="#f8fafc">BRIDGE</tspan>
        </text>
        <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="3.5">
          REST API &amp; TRADING GATEWAY
        </text>
      </g>
    </g>

    <!-- Main Value Proposition / Tagline -->
    <g transform="translate(0, 142)">
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
        Headless MetaTrader 5 on Linux
      </text>
      
      <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="17" font-weight="400" fill="#94a3b8" line-height="1.5">
        <tspan x="0" dy="0">Expose 100% of official MT5 Python methods through a robust,</tspan>
        <tspan x="0" dy="26">multi-threaded Flask REST API with interactive Swagger UI.</tspan>
      </text>
    </g>

    <!-- Key Feature Badges / Tech Matrix -->
    <g transform="translate(0, 260)">
      
      <!-- Badge 1: Docker Headless -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="42" rx="10" fill="#0c1730" stroke="#1e3a8a" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#38bdf8" />
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Docker Headless</text>
      </g>

      <!-- Badge 2: Swagger UI / OpenAPI 3.0 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="186" height="42" rx="10" fill="#09201a" stroke="#065f46" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#10b981" />
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">OpenAPI 3.0 UI</text>
      </g>

      <!-- Badge 3: 100% MT5 Coverage -->
      <g transform="translate(378, 0)">
        <rect x="0" y="0" width="160" height="42" rx="10" fill="#1e183a" stroke="#4338ca" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#a855f7" />
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Full MT5 API</text>
      </g>

      <!-- Badge 4: Python 3.12 -->
      <g transform="translate(0, 54)">
        <rect x="0" y="0" width="150" height="42" rx="10" fill="#1c1917" stroke="#334155" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#eab308" />
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Python 3.12</text>
      </g>

      <!-- Badge 5: WineHQ Staging -->
      <g transform="translate(162, 54)">
        <rect x="0" y="0" width="180" height="42" rx="10" fill="#1f131a" stroke="#831843" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#f43f5e" />
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">WineHQ Staging</text>
      </g>

      <!-- Badge 6: Auto-Reconnect Watchdog -->
      <g transform="translate(354, 54)">
        <rect x="0" y="0" width="184" height="42" rx="10" fill="#0e1e2d" stroke="#0e7490" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#06b6d4" />
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Auto-Recovery</text>
      </g>
    </g>

    <!-- Bottom Repository URL / Meta -->
    <g transform="translate(0, 474)">
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace" font-size="16" font-weight="600" fill="#64748b">
        <tspan fill="#38bdf8">github.com</tspan><tspan fill="#94a3b8">/liberatti/mt5bridge</tspan>
        <tspan fill="#475569" dx="18">|</tspan>
        <tspan fill="#10b981" dx="18">Apache-2.0 License</tspan>
      </text>
    </g>

  </g>

  <!-- ================= RIGHT COLUMN: LIVE API / TERMINAL CARD ================= -->
  <g transform="translate(670, 72)">
    
    <!-- Outer Glow for Terminal Panel -->
    <rect x="0" y="0" width="536" height="496" rx="20" fill="#060c1c" stroke="url(#panelBorder)" stroke-width="1.8" filter="url(#glow)" />

    <!-- Terminal Header Bar -->
    <g transform="translate(0, 0)">
      <path d="M 0 20 Q 0 0 20 0 L 516 0 Q 536 0 536 20 L 536 48 L 0 48 Z" fill="#0c162e" />
      <line x1="0" y1="48" x2="536" y2="48" stroke="#1e293b" stroke-width="1" />
      
      <!-- Traffic Light Buttons -->
      <circle cx="24" cy="24" r="6" fill="#f43f5e" />
      <circle cx="44" cy="24" r="6" fill="#f59e0b" />
      <circle cx="64" cy="24" r="6" fill="#10b981" />

      <!-- Terminal Tab Title -->
      <text x="268" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">
        REST Gateway • localhost:5000/api
      </text>
      
      <!-- Live Indicator -->
      <circle cx="504" cy="24" r="4.5" fill="#10b981" filter="url(#subtleGlow)" />
    </g>

    <!-- Terminal Body / Content -->
    <g transform="translate(24, 70)" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13">
      
      <!-- Request Line 1: POST /api/order/open -->
      <g>
        <rect x="0" y="0" width="58" height="22" rx="4" fill="#065f46" />
        <text x="29" y="15" font-weight="800" fill="#34d399" text-anchor="middle" font-size="11">POST</text>
        <text x="70" y="16" fill="#f8fafc" font-weight="700">/api/order/open</text>
        <text x="350" y="16" fill="#10b981" font-size="11" font-weight="600">● HTTP 200 OK</text>
      </g>

      <!-- JSON Payload Card -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="488" height="152" rx="10" fill="#080f24" stroke="#1e293b" stroke-width="1" />
        
        <g transform="translate(18, 24)" font-size="12.5" line-height="1.5">
          <text x="0" y="0" fill="#cbd5e1">{</text>
          
          <text x="20" y="22" fill="#7dd3fc">"symbol"<tspan fill="#cbd5e1">: </tspan><tspan fill="#34d399">"EURUSD"</tspan><tspan fill="#cbd5e1">,</tspan></text>
          <text x="20" y="44" fill="#7dd3fc">"order_type"<tspan fill="#cbd5e1">: </tspan><tspan fill="#f59e0b">"BUY"</tspan><tspan fill="#cbd5e1">,</tspan></text>
          <text x="20" y="66" fill="#7dd3fc">"volume"<tspan fill="#cbd5e1">: </tspan><tspan fill="#f43f5e">0.01</tspan><tspan fill="#cbd5e1">,</tspan></text>
          <text x="20" y="88" fill="#7dd3fc">"sl"<tspan fill="#cbd5e1">: </tspan><tspan fill="#f43f5e">1.05000</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#7dd3fc">"tp"<tspan fill="#cbd5e1">: </tspan><tspan fill="#f43f5e">1.10000</tspan></tspan></text>
          
          <text x="0" y="110" fill="#cbd5e1">}</text>
        </g>
      </g>

      <!-- Request Line 2: Response Stream & Telemetry -->
      <g transform="translate(0, 204)">
        <rect x="0" y="0" width="48" height="22" rx="4" fill="#0369a1" />
        <text x="24" y="15" font-weight="800" fill="#7dd3fc" text-anchor="middle" font-size="11">RES</text>
        <text x="60" y="16" fill="#94a3b8" font-size="12">Ticket: <tspan fill="#38bdf8" font-weight="700">#9382104</tspan> | Executed: <tspan fill="#34d399">1.08542</tspan></text>
      </g>

      <!-- Live Depth / Market Info Bar -->
      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="488" height="150" rx="10" fill="#080f24" stroke="#1e293b" stroke-width="1" />
        
        <!-- Market Rates Mini Header -->
        <g transform="translate(18, 22)">
          <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">LIVE MARKET DATA STREAM</text>
          
          <!-- Mini Candles Chart Illustration inside Terminal -->
          <g transform="translate(320, -10)">
            <line x1="10" y1="2" x2="10" y2="24" stroke="#10b981" stroke-width="1" />
            <rect x="8" y="6" width="4" height="12" fill="#10b981" />
            
            <line x1="22" y1="8" x2="22" y2="28" stroke="#f43f5e" stroke-width="1" />
            <rect x="20" y="12" width="4" height="10" fill="#f43f5e" />

            <line x1="34" y1="4" x2="34" y2="22" stroke="#10b981" stroke-width="1" />
            <rect x="32" y="8" width="4" height="10" fill="#10b981" />

            <line x1="46" y1="0" x2="46" y2="20" stroke="#10b981" stroke-width="1" />
            <rect x="44" y="2" width="4" height="12" fill="#10b981" />

            <line x1="58" y1="6" x2="58" y2="26" stroke="#f43f5e" stroke-width="1" />
            <rect x="56" y="8" width="4" height="8" fill="#f43f5e" />

            <line x1="70" y1="0" x2="70" y2="24" stroke="#10b981" stroke-width="1" />
            <rect x="68" y="4" width="4" height="14" fill="#10b981" />
          </g>

          <!-- Ticks Stats -->
          <g transform="translate(0, 24)" font-size="12">
            <text x="0" y="14" fill="#64748b">EURUSD Bid: <tspan fill="#f8fafc" font-weight="700">1.08542</tspan>  Ask: <tspan fill="#f8fafc" font-weight="700">1.08544</tspan></text>
            <text x="0" y="38" fill="#64748b">Account Equity: <tspan fill="#34d399" font-weight="700">$50,240.80</tspan>  Margin: <tspan fill="#38bdf8" font-weight="700">$21.71</tspan></text>
            <text x="0" y="62" fill="#64748b">Latency: <tspan fill="#a78bfa" font-weight="700">&lt; 1.2ms</tspan>  Terminal: <tspan fill="#10b981" font-weight="700">Connected (Build 4153)</tspan></text>
            <text x="0" y="86" fill="#38bdf8" font-size="11" font-weight="600">✓ 100% MT5 Functions Mapped &amp; Ready</text>
          </g>
        </g>
      </g>

    </g>

  </g>

</svg>
