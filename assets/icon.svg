<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="iconCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="iconBull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="iconBridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Box -->
  <rect x="2" y="2" width="176" height="176" rx="28" fill="url(#iconBg)" stroke="url(#iconBorder)" stroke-width="3" />

  <!-- Candlesticks -->
  <line x1="32" y1="95" x2="32" y2="145" stroke="#10b981" stroke-width="2" />
  <rect x="27" y="105" width="10" height="28" rx="2" fill="url(#iconBull)" filter="url(#iconGlow)" />

  <line x1="52" y1="65" x2="52" y2="135" stroke="#38bdf8" stroke-width="2" />
  <rect x="47" y="75" width="10" height="42" rx="2" fill="url(#iconCyan)" filter="url(#iconGlow)" />

  <line x1="72" y1="45" x2="72" y2="120" stroke="#34d399" stroke-width="2" />
  <rect x="67" y="55" width="10" height="50" rx="2" fill="url(#iconBull)" filter="url(#iconGlow)" />

  <!-- Bridge Suspension Arc -->
  <path d="M 25,120 Q 82,60 148,115" fill="none" stroke="url(#iconBridge)" stroke-width="5" stroke-linecap="round" filter="url(#iconGlow)" />
  <path d="M 25,120 Q 82,60 148,115" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Lower Deck -->
  <path d="M 20,135 L 160,135" fill="none" stroke="url(#iconBridge)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Stay Cables -->
  <line x1="62" y1="90" x2="62" y2="135" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.85" />
  <line x1="87" y1="78" x2="87" y2="135" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.85" />
  <line x1="112" y1="88" x2="112" y2="135" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.85" />
  <line x1="137" y1="108" x2="137" y2="135" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.85" />

  <!-- Network Nodes -->
  <line x1="148" y1="115" x2="155" y2="70" stroke="#818cf8" stroke-width="1.5" opacity="0.7" />
  <line x1="148" y1="115" x2="125" y2="60" stroke="#60a5fa" stroke-width="1.5" opacity="0.7" />
  <line x1="125" y1="60" x2="155" y2="70" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />

  <circle cx="148" cy="115" r="5" fill="#38bdf8" filter="url(#iconGlow)" />
  <circle cx="148" cy="115" r="2.5" fill="#ffffff" />
  <circle cx="155" cy="70" r="4" fill="#818cf8" filter="url(#iconGlow)" />
  <circle cx="155" cy="70" r="2" fill="#ffffff" />
  <circle cx="125" cy="60" r="4.5" fill="#60a5fa" filter="url(#iconGlow)" />
  <circle cx="125" cy="60" r="2" fill="#ffffff" />
</svg>
