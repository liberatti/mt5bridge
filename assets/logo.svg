<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070d1e" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Candle Bullish Gradient -->
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Bridge Arch Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="780" height="220" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Circuit / Grid Decors -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <path d="M 30,50 L 120,50 L 140,70 L 220,70" />
    <path d="M 50,190 L 160,190 L 180,170 L 240,170" />
    <path d="M 600,45 L 680,45 L 700,65 L 760,65" />
    <path d="M 560,195 L 650,195 L 670,175 L 750,175" />
    <circle cx="220" cy="70" r="3" fill="#38bdf8" />
    <circle cx="240" cy="170" r="3" fill="#38bdf8" />
    <circle cx="760" cy="65" r="3" fill="#38bdf8" />
    <circle cx="750" cy="175" r="3" fill="#38bdf8" />
  </g>

  <!-- ICON BADGE (Left) -->
  <g transform="translate(45, 30)">
    <!-- Badge Background -->
    <rect x="0" y="0" width="180" height="180" rx="20" fill="#0b132b" stroke="#1e293b" stroke-width="2" />
    
    <!-- Candlestick Charts (Trading Side) -->
    <!-- Candle 1 -->
    <line x1="30" y1="95" x2="30" y2="145" stroke="#10b981" stroke-width="2" />
    <rect x="25" y="105" width="10" height="28" rx="2" fill="url(#bullGrad)" filter="url(#subtleGlow)" />

    <!-- Candle 2 -->
    <line x1="50" y1="65" x2="50" y2="135" stroke="#38bdf8" stroke-width="2" />
    <rect x="45" y="75" width="10" height="42" rx="2" fill="url(#cyanGrad)" filter="url(#subtleGlow)" />

    <!-- Candle 3 (Peak) -->
    <line x1="70" y1="45" x2="70" y2="120" stroke="#34d399" stroke-width="2" />
    <rect x="65" y="55" width="10" height="50" rx="2" fill="url(#bullGrad)" filter="url(#subtleGlow)" />

    <!-- Bridge Structure -->
    <!-- Main Suspension Cables -->
    <path d="M 25,120 Q 80,60 145,115" fill="none" stroke="url(#bridgeGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
    <path d="M 25,120 Q 80,60 145,115" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Lower Deck / Bridge Span -->
    <path d="M 20,135 L 160,135" fill="none" stroke="url(#bridgeGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#subtleGlow)" />
    
    <!-- Vertical Stay Cables -->
    <line x1="60" y1="90" x2="60" y2="135" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.85" />
    <line x1="85" y1="78" x2="85" y2="135" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.85" />
    <line x1="110" y1="88" x2="110" y2="135" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.85" />
    <line x1="135" y1="108" x2="135" y2="135" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.85" />

    <!-- Digital Network Nodes (Right Bridge Anchor / REST API Side) -->
    <!-- Node Network Lines -->
    <line x1="145" y1="115" x2="155" y2="70" stroke="#818cf8" stroke-width="1.5" opacity="0.7" />
    <line x1="145" y1="115" x2="125" y2="60" stroke="#60a5fa" stroke-width="1.5" opacity="0.7" />
    <line x1="125" y1="60" x2="155" y2="70" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />

    <!-- Node Points -->
    <circle cx="145" cy="115" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="145" cy="115" r="2.5" fill="#ffffff" />
    
    <circle cx="155" cy="70" r="4" fill="#818cf8" filter="url(#subtleGlow)" />
    <circle cx="155" cy="70" r="2" fill="#ffffff" />

    <circle cx="125" cy="60" r="4.5" fill="#60a5fa" filter="url(#subtleGlow)" />
    <circle cx="125" cy="60" r="2" fill="#ffffff" />
  </g>

  <!-- BRAND TYPOGRAPHY (Right) -->
  <g transform="translate(255, 60)">
    <!-- Title Text -->
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
      <tspan fill="url(#cyanGrad)" filter="url(#subtleGlow)">MT5</tspan>
      <tspan fill="#f8fafc">BRIDGE</tspan>
    </text>

    <!-- Subtitle Pill / Tag -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="105" height="24" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="52.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">REST API</text>

      <rect x="115" y="0" width="130" height="24" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <text x="180" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">SWAGGER UI</text>

      <rect x="255" y="0" width="140" height="24" rx="6" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
      <text x="325" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="1">DOCKER LINUX</text>
    </g>

    <!-- Description -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      High-Performance Headless MetaTrader 5 Bridge for Python &amp; Web
    </text>
  </g>
</svg>
